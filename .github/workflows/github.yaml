name: Android Build, Lint & Automated GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    # The manifest-sync workflow commits update.json back to main; skip the full
    # APK build for that commit so publishing a release cannot loop.
    paths-ignore:
      - 'update.json'
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs, Bug Check & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pinned to the same version as gradle/wrapper/gradle-wrapper.properties
          # and ./gradlew. This was 'current', so CI resolved whatever Gradle
          # shipped that week while every local build used 9.3.1 — meaning a build
          # could pass here and fail on a developer's machine, or the reverse, with
          # nothing in the repository to explain the difference.
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Validate the workflow files
        run: |
          # A duplicate YAML key makes the whole workflow file invalid, and the
          # failure surfaces only as "this run likely failed because of a workflow
          # file issue" with no useful log. Catching it here turns that into a
          # readable error.
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint

          # actionlint exits non-zero when a glob matches nothing, so build the file
          # list explicitly and skip the step if the directory is somehow empty.
          mapfile -t FILES < <(find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No workflow files found; nothing to lint."
            exit 0
          fi
          printf 'Linting: %s\n' "${FILES[@]}"
          ./actionlint "${FILES[@]}"

      - name: Restore the committed release signing key
        run: |
          # Every published APK must share one signing key or Android refuses to
          # install updates (INSTALL_FAILED_UPDATE_INCOMPATIBLE). This step only
          # decodes the committed key; it must never generate a new one, because a
          # freshly generated key silently breaks every future update.
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > release-key.jks
            echo "Decoded release-key.jks from the committed key."
          else
            echo "::error::debug.keystore.base64 is missing. Without a stable key every" \
                 "build is signed differently and updates will not install. Restore the" \
                 "file from version control."
            exit 1
          fi

          # The debug key is only used by debug builds; generate it if absent.
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Fail loudly if the release key is unusable, rather than silently
          # shipping an APK signed with the wrong key.
          keytool -list -keystore release-key.jks -storepass android -alias upload

      - name: Resolve the release version
        id: version
        if: github.event_name != 'pull_request'
        env:
          # Required by the `gh release view` probe below. Without a token that
          # call exits non-zero on auth, which made the probe report "tag is
          # free" for a tag that already existed — so every build silently
          # overwrote the same release and its APK asset instead of adding one.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag is derived from the app's own versionName so the release, the
          # Settings > About version and the update manifest all agree.
          VERSION_NAME=$(grep '^kurdishTvVersionName=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          VERSION_NAME=${VERSION_NAME:-1.0.0}

          if [ "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Advance the patch number past the newest published release.
            #
            # This used to be a fixed value in gradle.properties, so once a
            # versionName shipped it stayed taken forever: every build resolved
            # to the same tag and overwrote the same release and APK asset. The
            # APK replaced itself in place, so a release that reported 1.0.22
            # kept changing contents underneath anyone who had already
            # downloaded it, and the release history stayed frozen at 1.0.22.
            #
            # Deriving it from the latest published tag means each green build
            # gets its own version, its own tag and its own immutable asset.
            LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo '')
            LATEST_PATCH=$(echo "${LATEST:-}" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*$/\3/')
            if echo "${LATEST:-}" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              BASE_PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
              NEXT_PATCH=$(( LATEST_PATCH > BASE_PATCH ? LATEST_PATCH : BASE_PATCH ))
              NEXT_PATCH=$(( NEXT_PATCH + 1 ))
              VERSION_NAME="1.0.${NEXT_PATCH}"
            fi

            TAG="v${VERSION_NAME}"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing as ${TAG}"

      - name: Android Lint
        run: |
          echo "::group::Running Android Lint"
          # Advisory only, and the comment above used to claim the opposite.
          #
          # `lint { abortOnError = false }` in app/build.gradle.kts means lint
          # reports findings without failing the build, so this step would never
          # stop a release either way. It is kept because the annotations are
          # useful in the run summary, but it must not be read as a gate.
          ./gradlew lintRelease --continue || echo "::warning::lint reported issues (see annotations)"
          echo "::endgroup::"

      - name: Unit tests
        run: |
          # A real gate, not an advisory step.
          #
          # The repository carries StorageTest, CachePolicyTest, DeviceModeTest,
          # RetryPolicyTest, ChannelFilterEngineTest, KurdishTvParserTest and
          # UpdateManifestParserTest, and this workflow ran none of them: it
          # linted (advisory only) and assembled a release APK. Every one of those
          # tests exists because a specific bug got shipped - a comma delimiter
          # that made watch history unreachable, a favourites write that reported
          # the intent rather than what reached disk, a cache guard that could be
          # silently inverted - and a test that is never executed is a comment.
          #
          # Robolectric needs to fetch its android-all jars on a cold runner, so
          # this step is the slowest in the workflow. That is still cheaper than
          # the alternative, which is finding out from a viewer's TV.
          echo "::group::Running JVM unit tests"
          # `test`, not `testReleaseUnitTest`: the per-variant task is not present
          # under this AGP, and the lifecycle task runs every unit-test variant
          # that does exist, which is what is wanted here anyway.
          ./gradlew test --stacktrace
          echo "::endgroup::"

      - name: Build Release APK
        run: |
          # The version name is resolved before the build and passed in, so the
          # version compiled into the APK (shown in Settings -> About) is the
          # same one the release tag and update manifest use. Resolving it after
          # the build left the APK advertising a version that was not the one it
          # was published under.
          #
          # One universal APK, deliberately. There is no `splits` block in
          # app/build.gradle.kts, so the per-ABI branches that used to sit in the
          # artifact step below could never match anything — they were copied
          # from a template that did have ABI splits. If per-ABI artifacts are
          # actually wanted, add the `splits` block *and* keep the branches.
          ./gradlew assembleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PkurdishTvVersionName="${{ steps.version.outputs.version_name }}" \
            --stacktrace

      - name: Prepare APK Artifact
        run: |
          OUTPUT_DIR="release-artifacts"
          mkdir -p "$OUTPUT_DIR"

          APK_BUILD_PATH="app/build/outputs/apk/release"
          APK=$(find "$APK_BUILD_PATH" -name '*.apk' -type f | head -1)

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced in $APK_BUILD_PATH"
            exit 1
          fi

          # Fail loudly rather than publishing a release with no asset attached.
          cp "$APK" "$OUTPUT_DIR/kurdish-tv-universal.apk"

          echo "Prepared $OUTPUT_DIR/kurdish-tv-universal.apk:"
          ls -la "$OUTPUT_DIR"

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: kurdish-tv-apks
          path: release-artifacts/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        # Publish on every green main build, on tags, and on manual dispatch.
        # Pull requests are excluded: they must not create releases.
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: "Kurdish TV Live ${{ env.TAG }} (${{ env.VERSION_NAME }})"
          body: |
            ## Kurdish TV Live

            ### 📦 APK package
            **kurdish-tv-universal.apk** runs on every device — phone, tablet and
            TV. There is only one build, so there is nothing to choose between.

            *Built from commit* `${{ github.sha }}` *on run* `${{ github.run_number }}`.

            ### ⚠️ Installing over an older build
            Every release is signed with the same key, so you can install this over
            any previous version without uninstalling first.

            If Android reports **"App not installed as package conflicts"**, an
            older copy signed with a *different* key is still present. Uninstall
            **Kurdish TV Live** once, then install this APK.

            ### 🛡️ "App blocked to protect your device"
            Google Play Protect flags any app that is not published on the Play
            Store and is signed by an unrecognised developer. This is expected
            for a sideloaded build. Choose **"More details" → "Install anyway"**,
            or temporarily disable Play Protect in Play Store → Settings.

            *Built with JDK 21 and verified by Android Lint.*
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*.apk

      - name: Publish the update manifest
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Written here rather than in a separate release-triggered workflow
          # because only the build job knows the run number, and the run number
          # is the APK's real VERSION_CODE (it is passed as -PversionCode).
          #
          # The app compares this version_code against BuildConfig.VERSION_CODE,
          # so publishing anything else here makes every comparison false and the
          # updater silently never offers an update.
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kurdish-tv-universal.apk"
          SIZE=$(stat -c%s release-artifacts/kurdish-tv-universal.apk)

          cat > update.json <<JSON
          {
            "version": "${VERSION_NAME}",
            "version_code": ${GITHUB_RUN_NUMBER},
            "release_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}",
            "download_url": "${ASSET_URL}",
            "size_bytes": ${SIZE},
            "published_at": "",
            "notes": "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::8}."
          }
          JSON

          cat update.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          # --quiet: this runs on every main build, and a no-op commit must not
          # produce an empty commit that would loop the workflow.
          git commit --quiet -m "Update manifest for ${TAG}" || echo "Manifest already current."
          git push --quiet || echo "Nothing to push."
